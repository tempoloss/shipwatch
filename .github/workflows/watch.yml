name: watch

on:
  schedule:
    # Daily. The runner decides which watchers are due from config.json, so
    # cadence lives in one reviewable file rather than several cron lines.
    # Tags: every 20h. ISO: weekly, because the source rate-limits and
    # publishes maintenance releases annually.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Declared explicitly rather than inherited: the default workflow permission for
# new personal repositories is read-only, which would fail the state push on
# every run from run one. Issues are created with GH_PAT, not GITHUB_TOKEN,
# because GITHUB_TOKEN cannot write to another repository.
permissions:
  contents: write

concurrency:
  # A retried or manually dispatched run must not race the scheduled one and
  # double-deliver. Queued, not cancelled: cancelling could stop the process
  # after delivery but before state is saved.
  group: shipwatch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        # The watchers are pure functions with no network, so this is fast and
        # catches a broken parse before it can write bad state.
        run: python -m unittest discover -s tests

      - name: Run watchers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python -m shipwatch.main

      - name: Commit state
        # always(): a crash in any earlier step must still produce a heartbeat
        # commit. That commit is the liveness proof AND what resets GitHub's
        # 60-day scheduled-workflow inactivity clock. Skipping it exactly when
        # the job is failing is how the schedule silently gets disabled.
        if: always()
        run: |
          git config user.name  "shipwatch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry once against a moved branch rather than losing the state
          # write, which would re-deliver every event on the next run.
          git push || (git pull --rebase --autostash && git push)
